{% macro icon(name, size=None) -%}
{%- set s = size or 16 -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
     width="{{ s }}" height="{{ s }}" style="flex:none">
{%- if name == 'dashboard' -%}
  <rect x="3" y="3" width="7.5" height="8.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/>
  <rect x="13.5" y="11" width="7.5" height="10" rx="2"/><rect x="3" y="14" width="7.5" height="7" rx="2"/>
{%- elif name == 'estimate' -%}
  <path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5l2.6-1.5M17.2 9l2.6-1.5"/>
  <circle cx="12" cy="12" r="4"/>
{%- elif name == 'portfolio' -%}
  <path d="M3 20h18"/><rect x="4" y="11" width="3.6" height="7" rx="1.2"/>
  <rect x="10.2" y="6" width="3.6" height="12" rx="1.2"/><rect x="16.4" y="13" width="3.6" height="5" rx="1.2"/>
{%- elif name == 'materials' -%}
  <path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="M3 12.2 12 16.7l9-4.5"/><path d="M3 16.7 12 21.2l9-4.5"/>
{%- elif name == 'history' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7.2V12l3.2 2"/>
{%- elif name == 'model' -%}
  <rect x="7" y="7" width="10" height="10" rx="2.5"/><path d="M10.5 3v4M13.5 3v4M10.5 17v4M13.5 17v4"/>
  <path d="M3 10.5h4M3 13.5h4M17 10.5h4M17 13.5h4"/>
{%- elif name == 'moon' -%}
  <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z"/>
{%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
{%- elif name == 'download' -%}
  <path d="M12 3v11M7.5 10 12 14.5 16.5 10"/><path d="M4 17v2.5A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5V17"/>
{%- elif name == 'plus' -%}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == 'arrow-right' -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'arrow-left' -%}
  <path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif name == 'check' -%}
  <path d="M4.5 12.5 9.5 17.5 19.5 6.5"/>
{%- elif name == 'check-circle' -%}
  <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3 11 15l4.8-5.4"/>
{%- elif name == 'alert' -%}
  <path d="M12 4.5 2.8 20h18.4L12 4.5Z"/><path d="M12 10v4M12 17h.01"/>
{%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- elif name == 'trash' -%}
  <path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/>
  <path d="M6.4 7l.8 12.1A1.5 1.5 0 0 0 8.7 20.5h6.6a1.5 1.5 0 0 0 1.5-1.4L17.6 7"/>
{%- elif name == 'copy' -%}
  <rect x="9" y="9" width="11" height="11" rx="2.4"/><path d="M15 5.5A1.5 1.5 0 0 0 13.5 4h-8A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15"/>
{%- elif name == 'printer' -%}
  <path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="2"/><path d="M7 14h10v6H7z"/>
{%- elif name == 'refresh' -%}
  <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.5V10H15"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
{%- elif name == 'zap' -%}
  <path d="M13.5 2.5 4.8 13.4h6L10.5 21.5l8.7-10.9h-6l.3-8.1Z"/>
{%- elif name == 'leaf' -%}
  <path d="M4.5 19.5C3 14 6 5.5 19.5 4.5c1 10.5-4.5 15.5-11.5 14.5"/><path d="M5.5 18.5c3.5-5 7-7.5 11-9"/>
{%- elif name == 'coins' -%}
  <ellipse cx="12" cy="6.4" rx="7.5" ry="3.2"/><path d="M4.5 6.4v5c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2v-5"/>
  <path d="M4.5 11.4v5c0 1.8 3.4 3.2 7.5 3.2s7.5-1.4 7.5-3.2v-5"/>
{%- elif name == 'target' -%}
  <circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1"/>
{%- elif name == 'trend-down' -%}
  <path d="M3.5 7.5 10 14l3.5-3.5L20.5 17"/><path d="M20.5 12.5V17H16"/>
{%- elif name == 'trend-up' -%}
  <path d="M3.5 16.5 10 10l3.5 3.5L20.5 7"/><path d="M20.5 11.5V7H16"/>
{%- elif name == 'shield' -%}
  <path d="M12 3 4.5 6v6c0 4.6 3.1 8 7.5 9.2 4.4-1.2 7.5-4.6 7.5-9.2V6L12 3Z"/><path d="M9 12.2l2.2 2.2L15.2 10"/>
{%- elif name == 'box' -%}
  <path d="M20.5 8.5v7l-8.5 5-8.5-5v-7l8.5-5 8.5 5Z"/><path d="M3.5 8.5 12 13.5l8.5-5M12 13.5v7"/>
{%- elif name == 'layers' -%}
  <path d="M12 3.5 3.5 8 12 12.5 20.5 8 12 3.5Z"/><path d="M3.5 12.5 12 17l8.5-4.5"/>
{%- elif name == 'gauge' -%}
  <path d="M4 17a9 9 0 1 1 16 0"/><path d="M12 17l4-5"/><circle cx="12" cy="17" r="1.4"/>
{%- elif name == 'sliders' -%}
  <path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2.2"/><circle cx="9" cy="16" r="2.2"/>
{%- elif name == 'clipboard' -%}
  <rect x="5" y="4.5" width="14" height="16" rx="2.4"/><path d="M9 4.5V3.4A1.4 1.4 0 0 1 10.4 2h3.2A1.4 1.4 0 0 1 15 3.4v1.1"/>
  <path d="M9 11h6M9 15h4"/>
{%- elif name == 'flask' -%}
  <path d="M9.5 3v6.2L4.6 18a2 2 0 0 0 1.7 3h11.4a2 2 0 0 0 1.7-3l-4.9-8.8V3"/><path d="M8.5 3h7M7.4 14h9.2"/>
{%- elif name == 'external' -%}
  <path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14v5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V8a1.5 1.5 0 0 1 1.5-1.5h5"/>
{%- elif name == 'truck' -%}
  <path d="M3 6.5h11v10H3z"/><path d="M14 10h3.6l2.9 3.1v3.4H14z"/><circle cx="7" cy="18.5" r="1.9"/><circle cx="17" cy="18.5" r="1.9"/>
{%- elif name == 'sparkle' -%}
  <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/>
{%- endif -%}
</svg>
{%- endmacro %}
